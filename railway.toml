[build]
# Ne redéployer le serveur que si son code change (pas pour la vitrine)
watchPatterns = ["server/**", "package.json", "package-lock.json", "railway.toml"]
builder = "NIXPACKS"
buildCommand = "npm install --omit=dev && npm install --prefix server --omit=dev"

[deploy]
startCommand = "node server/server.js"
