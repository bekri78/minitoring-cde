name: Vitrine OGMA (GitHub Pages)

# Publie la vitrine publique : les fichiers de vitrine/ + un instantané des données
# récupéré auprès du serveur. La clé d'accès est un secret du dépôt (OGMA_API_KEY) :
# elle n'apparaît jamais dans la page publiée. Si le serveur ne répond pas ou
# renvoie des données invalides, rien n'est publié et la version précédente reste en ligne.

on:
  push:
    branches: [main]
  schedule:
    - cron: '7,37 * * * *'   # toutes les 30 min (décalé de l'heure pleine, moins chargée)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer l'instantané des données
        env:
          OGMA_API_KEY: ${{ secrets.OGMA_API_KEY }}
        run: |
          if [ -z "$OGMA_API_KEY" ]; then
            echo "::error::Secret OGMA_API_KEY absent (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          mkdir -p vitrine/data
          curl -sSf --compressed --retry 3 --retry-delay 20 --max-time 120 \
            "https://minitoring-cde-production.up.railway.app/api/public/sharepoint/snapshot?key=${OGMA_API_KEY}" \
            -o vitrine/data/snapshot.json

      - name: Valider l'instantané
        run: |
          node -e '
            const s = JSON.parse(require("fs").readFileSync("vitrine/data/snapshot.json", "utf8"));
            const lists = ["osint", "news", "signals", "signalMarkers", "tracks", "maritimeEvents", "aviationEvents", "earthquakes"];
            if (s.type !== "ogma-snapshot" || s.schemaVersion !== 1) throw new Error("format inattendu");
            for (const k of lists) if (!Array.isArray(s.data[k])) throw new Error(k + " absent");
            if (!s.data.osint.length && !s.data.news.length) throw new Error("aucun événement");
            console.log("instantané du", s.generatedAt, "—", s.data.osint.length, "événements,", s.data.news.length, "articles,", (s.data.ruptures || []).length, "ruptures,", (s.data.convergences || []).length, "convergences");
          '

      - uses: actions/upload-pages-artifact@v3
        with:
          path: vitrine

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
